name: openmontage_mobile
description: OpenMontage Cloud - Higgsfield Studio Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.1.0
  
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Networking
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.4.0
  
  # Secure Storage
  flutter_secure_storage: ^9.2.2
  
  # Video Playback
  video_player: ^2.8.6
  chewie: ^1.8.0
  
  # Images
  cached_network_image: ^3.3.1
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.0
  
  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.2
  riverpod_lint: ^2.3.10
  drift_dev: ^2.18.0
  custom_lint: ^0.6.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700