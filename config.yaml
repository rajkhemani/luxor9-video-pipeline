# OpenMontage - Global Configuration

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: null                    # null = use provider default
  temperature: 0.7
  max_tokens: 4096
  # OpenAI-compatible chat endpoints, keyed by alias (lib/llm_client.py).
  # Agents and users only see the alias; model names stay in this file.
  # api_key_env names an environment variable; leave it out for local servers.
  endpoints:
    local:                                   # Ollama on this machine
      base_url: http://localhost:11434/v1
      model: llama3.1
    nim:                                     # NVIDIA NIM (bring your own nvapi- key)
      base_url: https://integrate.api.nvidia.com/v1
      model: deepseek-ai/deepseek-r1         # check current ids at build.nvidia.com
      api_key_env: NVIDIA_API_KEY
    openrouter:                              # OpenRouter (bring your own key)
      base_url: https://openrouter.ai/api/v1
      model: openrouter/auto                 # or any id from openrouter.ai/models
      api_key_env: OPENROUTER_API_KEY

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
