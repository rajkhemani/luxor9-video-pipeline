version: '3.8'

services:
  # ─── PocketBase (Auth + DB + Realtime + Storage + Admin UI) ─────
  pocketbase:
    image: ghcr.io/pocketbase/pocketbase:0.22.0
    command: 
      - serve
      - --http=0.0.0.0:8090
      - --publicDir=/pb_public
      - --encryptionEnv=PB_ENCRYPTION_KEY
    volumes:
      - pb_data:/pb_data
      - ./mvp/backend/pb_migrations:/pb_migrations
      - ./mvp/backend/pb_hooks:/pb_hooks
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      # Higgsfield
      - HIGGSFIELD_API_KEY=${HIGGSFIELD_API_KEY}
      - HIGGSFIELD_API_SECRET=${HIGGSFIELD_API_SECRET}
      # R2
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET}
      # Clerk
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      # Site
      - SITE_URL=${SITE_URL}
    ports:
      - "8090:8090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── Nginx Reverse Proxy + SSL ───────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./mvp/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./mvp/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/ssl/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ─── Render Workers (Scale to 0 when idle) ───────────────────────
  render-worker:
    build:
      context: .
      dockerfile: Dockerfile.render-worker
    environment:
      - REDIS_URL=${UPSTASH_REDIS_URL}
      - POCKETBASE_URL=http://pocketbase:8090
      - HIGGSFIELD_API_KEY=${HIGGSFIELD_API_KEY}
      - HIGGSFIELD_API_SECRET=${HIGGSFIELD_API_SECRET}
      - FAL_KEY=${FAL_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    deploy:
      replicas: 0  # Scaled via script based on queue depth
      resources:
        limits:
          cpus: '1'
          memory: 4G
        reservations:
          cpus: '0.25'
          memory: 1G
    depends_on:
      - pocketbase

volumes:
  pb_data: