# LUXOR9 brand rules consumed by tools/analysis/brand_quality_gate.py.
#
# Source: the locked LUXOR9 brand doctrine (obsidian/graphite + soft ivory,
# one rare "Luxor Signal" accent; "Say less. Mean more. Prove what matters.").
# The doctrine names colors but not hex values, so the hexes below are
# PROVISIONAL until approved design tokens exist. Change brand rules here,
# never inside the gate.

name: luxor9
version: "0.1.0"

palette:
  # Every color used in a deliverable must be within `color_tolerance`
  # (Euclidean RGB distance) of one of these.
  obsidian: "#0C0E0F"
  graphite: "#15181A"
  graphite_raised: "#1D2124"
  hairline: "#2B3134"
  ivory: "#ECE8DF"
  ivory_muted: "#A8A49B"
  luxor_signal: "#79C6BF"
  white: "#FFFFFF"
  black: "#000000"

color_tolerance: 24

# Off-doctrine palettes found elsewhere in this repo. A match is reported
# with a specific message so drift is easy to trace.
retired_colors:
  "#00D4FF": "cyan from apps/luxor9-final/docs/DESIGN_SYSTEM.md"
  "#8B5CF6": "purple from DESIGN_SYSTEM.md / social-creative-plan.md"
  "#C8A96A": "champagne gold from the campaign docs"

copy:
  # Doctrine voice: avoid boastful, vague, buzzword-heavy, salesy language.
  discouraged_phrases:
    - revolutionary
    - game-changing
    - game changer
    - cutting-edge
    - next-gen
    - next generation
    - disruptive
    - world-class
    - best-in-class
    - unleash
    - supercharge
    - skyrocket
    - mind-blowing
    - synergy
  # Promissory or misleading claims that regulated (financial) clients
  # cannot publish. These block a deliverable.
  prohibited_phrases:
    - guaranteed returns
    - guaranteed return
    - guaranteed profit
    - risk-free
    - risk free
    - no risk
    - can't lose
    - cannot lose
    - get rich
    - double your money

# Score: 1.0 minus penalties, floored at 0. Any error blocks shipping.
scoring:
  error_penalty: 0.25
  warning_penalty: 0.05
  pass_threshold: 0.8
